name: swtpm-arch
on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build my swtpm-arch image
        run: docker build . --file Dockerfile --tag surendras26/swtpm-arch:latest
      
      - name: Login into my DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push to my DockerHub
        run: docker push surendras26/swtpm-arch:latest
      
      - name: Pull my Latest image for Github Release
        run: |
          docker pull surendras26/swtpm-arch:latest
          docker save surendras26/swtpm-arch:latest | xz -T0 -9 > swtpm-arch-docker.tar.xz

      - name: Upload image to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: swtpm-arch-docker.tar.xz
          overwrite_files: true
          body_path: .github/release-notes.md
