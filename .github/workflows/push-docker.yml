name: docker image CI
on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build my swtpm-arch image
        run: docker build . --file Dockerfile --tag surendras26/swtpm-arch:latest
      
      - name: login into dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: push to dockerhub
        run: docker push surendras26/swtpm-arch:latest
       
